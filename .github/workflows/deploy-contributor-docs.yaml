name: "CD: Deploy Contributor Docs"

# Publishes the Astro + Starlight contributor documentation (contributor-docs/) to GitHub Pages
# at https://jc.id.lv/dicechess-play-api (#203, phase 3). The bot-developer docs that used to
# occupy this slot now live at https://bots.jc.id.lv, deployed by deploy-docs.yaml; the old
# bot-doc slugs are served here as redirect pages (see contributor-docs/astro.config.mjs).
# Paths-filtered so backend and bot-docs pushes never trigger this deploy.
on:
  push:
    branches: [main]
    paths:
      - 'contributor-docs/**'
      - '.github/workflows/deploy-contributor-docs.yaml'
  workflow_dispatch:

# One concurrent Pages deployment; a newer push supersedes an in-flight one.
concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  BUILD_PATH: "./contributor-docs"

jobs:
  build:
    name: Build Contributor Docs
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only; the Pages artifact upload needs no write scope here
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "${{ env.BUILD_PATH }}/package-lock.json"

      - name: Install Node Dependencies
        run: npm ci
        working-directory: ${{ env.BUILD_PATH }}

      - name: Build with Astro
        run: npm run build
        working-directory: ${{ env.BUILD_PATH }}

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "${{ env.BUILD_PATH }}/dist"

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
