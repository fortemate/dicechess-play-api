name: "CD: Deploy Contributor Docs"

on:
  push:
    branches: [main]
    paths:
      - "contributor-docs/**"
      - "src/main/resources/db/migration/**"
      - "scripts/generate-schema-docs.sh"
      - ".github/workflows/deploy-contributor-docs.yaml"
  pull_request:
    paths:
      - "contributor-docs/**"
      - "src/main/resources/db/migration/**"
      - "scripts/generate-schema-docs.sh"
      - ".github/workflows/deploy-contributor-docs.yaml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Contributor Docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Verify schema docs drift
        run: |
          mise run contrib-docs:schema
          git diff --exit-code contributor-docs/src/content/docs/reference/schema.md

      - name: Install dependencies
        run: npm ci
        working-directory: contributor-docs

      - name: Build with Astro
        run: npm run build
        working-directory: contributor-docs

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "contributor-docs/dist"

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
