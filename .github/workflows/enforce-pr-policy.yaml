name: "CI: PR Policy"

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read

jobs:
  check-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate branch convention or linked issue
        uses: actions/github-script@v9
        with:
          script: |
            const headRef = context.payload.pull_request.head.ref;
            const body = context.payload.pull_request.body || "";

            // Skip validation for Dependabot branches
            if (headRef.startsWith('dependabot/')) {
              console.log('Skipping validation for Dependabot branch.');
              return;
            }

            // Allowed branch prefixes. Issue-driven work uses task|feat|bug and links its issue;
            // issueless work (refactor|chore|docs|ci|test|perf) needs no issue. The <id>- segment is
            // optional, so `feat/123-add-clocks` and `refactor/extract-clock-policy` are both valid.
            const pattern = /^(task|feat(ure)?|fix|bug|refactor|chore|docs|ci|test|perf)\/((issue-)?\d+-)?[a-z0-9-]+$/;
            const followsConvention = pattern.test(headRef);
            const closingIssuePattern = /\b(?:Closes|Resolves|Fixes)\s+#(\d+)\b/gi;
            const closingIssueIds = new Set(
              Array.from(body.matchAll(closingIssuePattern), match => match[1])
            );

            // Require an issue link matching the branch issue ID when present in a conventional branch.
            const match = headRef.match(/^[a-z]+\/(?:issue-)?(\d+)-/);
            if (match) {
              const issueId = match[1];
              if (!closingIssueIds.has(issueId)) {
                core.setFailed(`Branch "${headRef}" references issue #${issueId}, but the pull request body does not contain "Closes #${issueId}" (or Fixes/Resolves).`);
                return;
              }
            }

            if (!followsConvention && closingIssueIds.size === 0) {
              core.setFailed(`Branch "${headRef}" does not follow the preferred <type>/<short-desc> convention. Tool-managed branch names are accepted when the pull request body closes an issue with "Closes #<id>" (or Fixes/Resolves).`);
              return;
            }

            if (!followsConvention) {
              console.log(`Accepting tool-managed branch "${headRef}" because the pull request closes issue(s): ${Array.from(closingIssueIds).map(id => `#${id}`).join(', ')}.`);
            }
            console.log('PR policy OK.');
