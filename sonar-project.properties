# ==============================================================================
# SonarCloud Project Configuration
# ==============================================================================

# Unique identifier representing the organization on SonarCloud
sonar.organization=fortemate

# Project identity
sonar.projectKey=fortemate_dicechess-play-api
sonar.projectName=dicechess-play-api

# Relative paths to source and test roots
sonar.sources=src/main/scala
sonar.tests=src/test/scala
sonar.coverage.exclusions=src/main/scala/dicechess/play/Main.scala

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# ==============================================================================
# Coverage Reporting (sbt-scoverage)
# ==============================================================================

# Path to the generated XML report; SonarCloud consumes the native scoverage XML.
sonar.scala.coverage.reportPaths=target/out/jvm/scala-3.8.4/dicechess-play-api/scoverage-report/scoverage.xml
