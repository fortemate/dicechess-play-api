        '401': { $ref: '#/components/responses/ManagedWebhookProblem' }
        '403': { $ref: '#/components/responses/ManagedWebhookProblem' }
        '404': { $ref: '#/components/responses/ManagedWebhookProblem' }
        '409': { $ref: '#/components/responses/ManagedWebhookProblem' }
        '412': { $ref: '#/components/responses/ManagedWebhookProblem' }
        '415': { $ref: '#/components/responses/ManagedWebhookProblem' }
        '422': { $ref: '#/components/responses/ManagedWebhookProblem' }
        '428': { $ref: '#/components/responses/ManagedWebhookProblem' }
  /admin/bots/{team}/{name}/webhook/stats:
    parameters:
      - { $ref: '#/components/parameters/BotTeam' }
      - { $ref: '#/components/parameters/BotName' }
    get:
      tags: [Webhook management, Admin]
      summary: Read any bot's bot-history webhook telemetry as an administrator
      security:
        - cookieAuth: []
      responses:
        '200': { $ref: '#/components/responses/ManagedWebhookStats' }
        '401': { $ref: '#/components/responses/ManagedWebhookProblem' }
        '403': { $ref: '#/components/responses/ManagedWebhookProblem' }
        '404': { $ref: '#/components/responses/ManagedWebhookProblem' }
  /admin/bots:
    get:
      tags: [Admin]
      summary: Complete bot inventory
      description: >
        Returns the administrator's complete inventory, including provisional and closed bots,
        enriched with seating capacity, load utilization, and verified webhook diagnostics (excluding HMAC secrets).
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Full inventory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBots'
        '401':
          description: Unauthorized. Live user session required.
        '403':
          description: Forbidden. Signed-in account is not on the PLAY_ADMINS allowlist.
  /admin/bots/{team}/{name}/capacity:
    post:
      tags: [Admin]
      summary: Set bot concurrent seating capacity
      description: >
        Sets the maximum number of concurrent games the bot is willing to play (1..32) without
        needing the bot's own token or owner session. Audited in play.admin_actions.
      security:
        - cookieAuth: []
      parameters:
        - name: team
          in: path
          required: true
          schema: { type: string }
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCapacity'
      responses:
        '200':
          description: Updated capacity snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capacity'
        '400':
          description: Invalid capacity (must be between 1 and 32).
        '401':
          description: Unauthorized. Live user session required.
        '403':
          description: Forbidden. Signed-in account is not on the PLAY_ADMINS allowlist.
        '404':
          description: No such registered bot.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Authorization: Bearer <token>. This is the default for Bot API operations; public routes
        override security with [], while owner/admin operations override it with cookieAuth.
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: 'HttpOnly session cookie minted by the play server during user login.'
  parameters:
    GameId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Game id.
    ChallengeId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Challenge id.
    SeekId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Seek id.
    BotTeam:
      name: team
      in: path
      required: true
      schema: { type: string }
      description: Registered bot team slug.
    BotName:
      name: name
      in: path
      required: true
      schema: { type: string }
      description: Registered bot name slug.
    WebhookSetupId:
      name: setupId
      in: path
      required: true
      schema:
        type: string
        pattern: '^whs_[A-Za-z0-9_-]+$'
      description: Opaque setup id returned by the create response or redacted slot.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: >
        Mandatory on POST /showcase/claim, scoped per calling actor (session account or guest id). Generate
        one UUID per claim attempt and reuse it for every retry of that attempt; retries replay the committed
        outcome for 24 hours.
    ManagedWebhookOrigin:
      name: Origin
      in: header
      required: true
      schema: { type: string }
      description: Must exactly match one origin configured in PLAY_CORS_ORIGINS.
    ManagedWebhookCsrf:
      name: X-DiceChess-CSRF
      in: header
      required: true
      schema:
        type: string
        enum: ['1']
      description: Explicit session-mutation CSRF signal; the only accepted value is 1.
    ManagedWebhookIfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: '^"whrev_[A-Za-z0-9_-]+"$'
        example: '"whrev_0197f0a0-0000-7000-8000-000000000001"'
      description: >
        Exactly one strong ETag copied from the last slot response. Weak tags, wildcards, lists,
        and unquoted revisions are rejected; treat the value as opaque.
  headers:
    ManagedWebhookEtag:
      description: Strong opaque non-ABA revision for the returned/current webhook slot.
      schema:
        type: string
        pattern: '^"whrev_[A-Za-z0-9_-]+"$'
        example: '"whrev_0197f0a0-0000-7000-8000-000000000001"'
    NoStore:
      description: Session webhook responses must never be stored by browsers or intermediaries.
      schema:
        type: string
        const: no-store
    NoCache:
      description: Additional protection on the sole secret-bearing setup response.
      schema:
        type: string
        const: no-cache
    ManagedWebhookLocation:
      description: Canonical path of the newly created pending setup.
      schema: { type: string }
    RetryAfter:
      description: Whole seconds until a verification budget can be attempted again.
      schema: { type: integer, minimum: 1 }
  responses:
    Unauthorized:
      description: Missing, invalid, or expired Bearer token.
    NotFound:
      description: Unknown resource.
    RateLimited:
      description: Rate limited — check the `Retry-After` header.
    RegisteredOnly:
      description: The caller is anonymous or static; this feature needs a registered identity.
    ManagedWebhookSlot:
      description: Authoritative redacted webhook slot.
      headers:
        ETag: { $ref: '#/components/headers/ManagedWebhookEtag' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ManagedWebhookSlot' }
    ManagedWebhookSetupCreated:
      description: >
        Pending setup created. This is the only response that reveals the candidate signing
        secret; store it before activation because it cannot be recovered.
      headers:
        ETag: { $ref: '#/components/headers/ManagedWebhookEtag' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Pragma: { $ref: '#/components/headers/NoCache' }
        Location: { $ref: '#/components/headers/ManagedWebhookLocation' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ManagedWebhookSetupCreated' }
    ManagedWebhookStats:
      description: Bot-history scoped delivery telemetry and current registration generation.
      headers:
        Cache-Control: { $ref: '#/components/headers/NoStore' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ManagedWebhookDeliveryStats' }
    ManagedWebhookProblem:
      description: >
        Typed session webhook-management problem. A 412 includes current plus its ETag; a 429
        includes Retry-After. Secret material and raw transport details are never returned.
        A 503 (webhook_verification_unavailable) means this server has no outbound verification
        transport configured, so staged setup and activation fail closed while reads keep working;
        it is not the feature gate, which leaves the routes unmounted and answers 404 instead.
      headers:
        ETag: { $ref: '#/components/headers/ManagedWebhookEtag' }
        Cache-Control: { $ref: '#/components/headers/NoStore' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ManagedWebhookProblem' }
  schemas:
    TokenResponse:
      type: object
      properties:
        token: { type: string }
        team: { type: string }
        name: { type: string }
        id: { type: string, description: 'External id, e.g. bot:team:anon:mybot-8b7a6c5d.' }
      required: [token, team, name, id]
    RegisterRequest:
      type: object
      properties:
        team: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$', maxLength: 32 }
        name: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$', maxLength: 32 }
      required: [team, name]
    Account:
      type: object
      properties:
        team: { type: string }
        name: { type: string }
        id: { type: string }
      required: [team, name, id]
    LadderState:
      type: object
      properties:
        onLadder: { type: boolean }
      required: [onLadder]
    SetOpenToHumans:
      type: object
      properties:
        description: { type: string, maxLength: 200, description: 'Optional catalog blurb; omit or empty to clear.' }
    OpenToHumansState:
      type: object
      properties:
        openToHumans: { type: boolean }
        description: { type: string }
      required: [openToHumans]
    SetCapacity:
      type: object
      properties:
        maxConcurrentGames:
          type: integer
          minimum: 1
          maximum: 32
          description: 'Games this bot will hold at once. A registered bot starts at 1.'
      required: [maxConcurrentGames]
    Capacity:
      type: object
      properties:
        maxConcurrentGames: { type: integer, description: 'The declaration itself.' }
        openToHumans: { type: boolean, description: 'Whether the bot is in the human catalog.' }
        ladderAllowance:
          type: integer
          description: >
            How much of the declaration the rating ladder may occupy. For a catalog bot this is
            maxConcurrentGames - 1 (one slot is kept free for a person), with a floor of 1.
        activeGames: { type: integer, description: 'Games in flight right now.' }
      required: [maxConcurrentGames, openToHumans, ladderAllowance, activeGames]
    CatalogBot:
      type: object
      properties:
        team: { type: string }
        name: { type: string }
        rating: { type: number }
        rd: { type: number }
        provisional: { type: boolean }
        description: { type: string }
        available:
          type: boolean
          description: >
            Below its declared concurrent-game limit as of this fetch. Advisory — the catalog is
            fetched once per visit, not polled, so the bot's actual state can move before a click;
            the wake probe and play-bot's 409 remain authoritative.
      required: [team, name, rating, rd, provisional, available]
    BotCatalog:
      type: object
      properties:
        bots:
          type: array
          items: { $ref: '#/components/schemas/CatalogBot' }
      required: [bots]
    Wake:
      type: object
      properties:
        alive: { type: boolean }
        busy:
          type: boolean
          description: >
            The bot is at its declared concurrent-game limit and was NOT probed at all — a busy bot
            is never woken, so alive is always false alongside busy: true.
      required: [alive, busy]
    Side:
      type: string
      enum: [White, Black]
    PlayBotRequest:
      type: object
      properties:
        guestId:
          type: string
          format: uuid
          description: >-
            Anonymous fallback. Required only when the request carries no account session cookie; with a session the
            player is seated from it and this field is ignored.
        team: { type: string }
        name: { type: string }
        timeControl: { $ref: '#/components/schemas/TimeControl' }
        preferredColor:
          allOf: [{ $ref: '#/components/schemas/Side' }]
          description: Omitted = random seat.
        rated:
          type: boolean
          default: false
          description: >-
            Optional, defaults to false. Any registered bot can be played rated — there is no curated roster.
            A guest player (no account session) always plays casual regardless of this field.
      required: [team, name, timeControl]
    ShowcaseBot:
      type: object
      description: The configured featured bot. displayName is the same face every board renders for a bot.
      properties:
        team: { type: string }
        name: { type: string }
        displayName: { type: string }
      required: [team, name, displayName]
    ShowcaseTimeControl:
      type: object
      description: The table's fixed clock, spelled out for display.
      properties:
        initialSeconds: { type: integer, example: 300 }
        incrementSeconds: { type: integer, example: 3 }
        display: { type: string, example: '5+3' }
      required: [initialSeconds, incrementSeconds, display]
    ShowcaseGame:
      type: object
      description: The current game, for spectating — the /games listing's public fields plus which seat the human holds.
      properties:
        gameId: { type: string }
        players:
          anyOf: [{ $ref: '#/components/schemas/Players' }, { type: 'null' }]
        humanSeat: { $ref: '#/components/schemas/Seat' }
        activeSeat: { $ref: '#/components/schemas/Seat' }
        dicePending: { type: boolean }
        clocks:
          anyOf: [{ $ref: '#/components/schemas/Clocks' }, { type: 'null' }]
        version: { type: integer }
        dfen: { type: string }
        status: { type: object, description: 'Single-key status, e.g. {"Active":{}} or {"Ended":{...}}.' }
      required: [gameId, humanSeat, activeSeat, dicePending, version, dfen, status]
    ShowcaseSpectator:
      type: object
      properties:
        wsUrl:
          type: string
          description: Relative reference against the API origin — /games/{id}/ws — for a spectator socket.
      required: [wsUrl]
    ShowcaseView:
      type: object
      description: GET /showcase.
      properties:
        status:
          type: string
          enum: [unavailable, open, live, finishing]
        featuredBot:
          anyOf: [{ $ref: '#/components/schemas/ShowcaseBot' }, { type: 'null' }]
          description: The configured bot; null only when the showcase is disabled.
        timeControl: { $ref: '#/components/schemas/ShowcaseTimeControl' }
        nextHumanColor:
          anyOf: [{ $ref: '#/components/schemas/Side' }, { type: 'null' }]
          description: The colour the next human plays — present when open, and while a game is on as the colour offered next.
        currentGame:
          anyOf: [{ $ref: '#/components/schemas/ShowcaseGame' }, { type: 'null' }]
          description: The one current game when live or finishing; null otherwise.
        spectator:
          anyOf: [{ $ref: '#/components/schemas/ShowcaseSpectator' }, { type: 'null' }]
        reason:
          type: [string, 'null']
          enum: [disabled, maintenance, bot_unavailable, null]
          description: Present only when unavailable. Coarse on purpose.
      required: [status, timeControl]
    ShowcaseClaimRequest:
      type: object
      description: >
        The claim body. A signed-in caller may send an empty object or no body at all; without a
        session, guestId is required.
      properties:
        guestId:
          type: string
          format: uuid
          description: The browser's stable guest id — the anonymous fallback identity, ignored when a session cookie is present.
        clientEntropy:
          type: string
          minLength: 16
          maxLength: 128
          description: Optional dice seed for the human seat, folded in exactly as a SubmitSeed over the socket would be.
    ShowcaseClaimed:
      type: object
      description: The winning claim — the only response on this surface that carries a credential.
      properties:
        outcome: { type: string, enum: [claimed] }
        gameId: { type: string }
        seat: { $ref: '#/components/schemas/Seat' }
        seatToken: { type: string, description: The human seat's capability token. Treat as a secret. }
        wsUrl:
          type: string
          description: Relative reference against the API origin — /games/{id}/ws?token=… — opening the human seat.
      required: [outcome, gameId, seat, seatToken, wsUrl]
    ShowcaseSpectating:
      type: object
      description: Every non-winning answer. Never carries a credential.
      properties:
        outcome: { type: string, enum: [spectating] }
        reason:
          type: string
          enum: [already_claimed, game_ended]
          description: already_claimed while the named game is on; game_ended when a retry names a finished game.
        gameId: { type: [string, 'null'] }
        spectatorWsUrl:
          type: [string, 'null']
          description: /games/{id}/ws while the game still has a room; null once it is gone.
      required: [outcome, reason]
    ShowcaseProblem:
      type: object
      description: RFC 7807 problem details for the showcase surface.
      properties:
        status: { type: integer }
        code:
          type: string
          enum:
            - missing_idempotency_key
            - invalid_idempotency_key
            - guest_required
            - invalid_guest_id
            - malformed_request
            - request_too_large
            - csrf_origin_rejected
            - idempotency_conflict
            - rate_limited
            - showcase_unavailable
        title: { type: string }
        detail: { type: string }
        instance: { type: string }
      required: [status, code, title, detail, instance]
    PlayBotMatch:
      type: object
      properties:
        gameId: { type: string }
        token: { type: string, description: The guest's seat capability token. }
        seat: { $ref: '#/components/schemas/Seat' }
      required: [gameId, token, seat]
    CreateChallengeRequest:
      type: object
      properties:
        team: { type: string }
        name: { type: string }
        timeControl:
          allOf: [{ $ref: '#/components/schemas/TimeControl' }]
          description: Optional — the server defaults an omitted time control to Unlimited.
        rated:
          type: boolean
          default: false
          description: >-
            Optional, defaults to false. Your own choice as challenger, and part of the offer — the target sees it in
            GET /bot/challenges and accepts the challenge as offered or declines it. Any registered opponent can be
            played rated; there is no curated roster. If either side is anonymous (a bot registered under the shared
            anonymous team) the game is silently played casual instead of being refused: unlike a public seek there is
            no third party the offer could be left open for.
      required: [team, name]
    Challenge:
      type: object
      properties:
        id: { type: string }
        challenger: { $ref: '#/components/schemas/Principal' }
        target: { $ref: '#/components/schemas/Principal' }
        timeControl: { $ref: '#/components/schemas/TimeControl' }
        rated:
          type: boolean
          description: Whether accepting this challenge plays for rating. Part of the offer, set by the challenger.
        targetOnline: { type: boolean, description: Advisory — whether the target holds an account stream. }
      required: [id, challenger, target, timeControl, rated]
    ChallengeList:
      type: object
      properties:
        in: { type: array, items: { $ref: '#/components/schemas/Challenge' } }
        out: { type: array, items: { $ref: '#/components/schemas/Challenge' } }
      required: [in, out]
    GameCreated:
      type: object
      properties:
        gameId: { type: string }
      required: [gameId]
    MoveRequest:
      type: object
      description: >
        Submit a turn of moves (optionally piggybacking a draw offer), or accept a pending draw offer.
      properties:
        moves:
          type: array
          items: { type: string, description: A UCI micro-move, e.g. e2e4. }
          description: One entry per rolled die; a root-to-leaf path of the legal-move tree.
        offerDraw:
          type: boolean
          default: false
          description: Piggyback a draw offer onto this completed turn (ignored if offer not allowed).
        acceptDraw:
          type: boolean
          default: false
          description: Accept a pending draw offer instead of submitting moves (moves array may be omitted or empty).
    MoveVerdict:
      type: object
      properties:
        applied: { type: boolean }
        version: { type: [integer, 'null'], description: The resulting TurnPlayed version, or null when refused. }
        reason: { type: [string, 'null'], description: Rejection reason when not applied. }
      required: [applied]
    MyGame:
      type: object
      properties:
        gameId: { type: string }
        seat: { $ref: '#/components/schemas/Seat' }
        activeSeat: { $ref: '#/components/schemas/Seat' }
        dicePending: { type: boolean }
        timeControl: { $ref: '#/components/schemas/TimeControl' }
        clocks: { $ref: '#/components/schemas/Clocks' }
        version: { type: integer }
      required: [gameId, seat, activeSeat, dicePending, timeControl, version]
    PublicGame:
      type: object
      properties:
        gameId: { type: string }
        players: { $ref: '#/components/schemas/Players' }
        timeControl: { $ref: '#/components/schemas/TimeControl' }
        activeSeat: { $ref: '#/components/schemas/Seat' }
        dicePending: { type: boolean }
        clocks: { $ref: '#/components/schemas/Clocks' }
        version: { type: integer }
        dfen: { type: string }
      required: [gameId, timeControl, activeSeat, dicePending, version, dfen]
    PublicGameState:
      type: object
      description: The single-game snapshot — identical to the game stream's Snapshot.state.
      properties:
        version: { type: integer }
        dfen: { type: string, description: DFEN — the 7th field is the pending dice pool as piece letters. }
        activeSeat: { $ref: '#/components/schemas/Seat' }
        dicePending: { type: boolean }
        status: { type: object, description: 'Single-key status, e.g. {"Active":{}} or {"Ended":{}}.' }
        timeControl: { $ref: '#/components/schemas/TimeControl' }
        clocks: { $ref: '#/components/schemas/Clocks' }
        commit: { type: string, description: SHA-256 of the server seed (the dice commitment). }
        seed: { type: [string, 'null'], description: Revealed server seed after the game ends (null until then; nothing is withheld once it has). }
        clientSeeds: { type: [object, 'null'], description: The two revealed client seeds, or null. }
        drawOffer:
          type: [object, 'null']
          description: Present when a draw offer is pending for the active player.
          properties:
            pending: { type: boolean, default: true }
        mayOfferDraw:
          type: [boolean, 'null']
          description: Whether the active player is allowed to offer a draw this turn under anti-spam alternation.
        legalMoves:
          anyOf: [{ $ref: '#/components/schemas/MoveTree' }, { type: 'null' }]
          description: The legal-move tree while dicePending; null if too large to inline (fetch GET /games/{id}/moves) or absent otherwise.
        players:
          anyOf: [{ $ref: '#/components/schemas/Players' }, { type: 'null' }]
          description: Both seats' public faces; may be absent.
        rated:
          type: [boolean, 'null']
          description: >
            Whether this game counts toward rating. Absent/null means "the server does not say" —
            never assume casual. No rating delta is sent at game end (ratings apply asynchronously);
            refetch the profile or leaderboard instead.
      required: [version, dfen, activeSeat, dicePending, status, timeControl, commit]
    LegalMovesResponse:
      type: object
      properties:
        version: { type: integer }
        dfen: { type: string }
        dicePending: { type: boolean }
        legalMoves: { $ref: '#/components/schemas/MoveTree' }
      required: [version, dfen, dicePending, legalMoves]
    GameHistory:
      type: object
      description: A finished game's full replay, from GET /games/{id}/history.
      properties:
        gameId: { type: string }
        players: { $ref: '#/components/schemas/Players' }
        rated: { type: boolean }
        timeControl: { $ref: '#/components/schemas/TimeControl' }
        result: { type: integer, description: White-POV — 1 white won, -1 black won, 0 draw. }
        termination: { type: string, description: 'One of: king_captured, timeout, resign, draw_agreement, aborted.' }
        finishedAt: { type: string, format: date-time }
        initialDfen: { type: string }
        turns:
          type: array
          items: { $ref: '#/components/schemas/HistoryTurn' }
        fairness: { $ref: '#/components/schemas/HistoryFairness' }
      required:
        [gameId, players, rated, timeControl, result, termination, finishedAt, initialDfen, turns, fairness]
    GameRatingChange:
      type: object
      description: What one finished game did to each seat's rating, from GET /games/{id}/rating.
      properties:
        gameId: { type: string }
        applied:
          type: boolean
          description: >
            Whether the rating batch has visited this game yet. False is temporary — poll it. True is final,
            even when both seats are absent.
        white: { $ref: '#/components/schemas/SeatRatingChange' }
        black: { $ref: '#/components/schemas/SeatRatingChange' }
      required: [gameId, applied]
    SeatRatingChange:
      type: object
      nullable: true
      description: >
        One seat's rating on both sides of the game, unrounded. Absent (null) when that seat's rating did not move.
        The delta is after - before; it is not sent, so there is one place it can be computed from.
      properties:
        before: { type: number, format: double }
        after: { type: number, format: double }
      required: [before, after]
    HistoryTurn:
      type: object
      properties:
        turnNumber: { type: integer }
        activeColor: { $ref: '#/components/schemas/Seat' }
        dice: { type: array, items: { type: integer } }
        moves: { type: array, items: { type: string }, description: UCI micro-moves; empty means a forced pass. }
        fenAfter: { type: string }
      required: [turnNumber, activeColor, dice, moves, fenAfter]
    HistoryFairness:
      type: object
      description: >
        The dice-fairness reveal. Every game in the archive has already finished, so all three fields are
        populated here — the nullable types are kept for wire compatibility, not because a finished history
        ever withholds them. (Active-state nullability is PublicGameState's story, not this one.)
      properties:
        commit: { type: [string, 'null'] }
        seed: { type: [string, 'null'] }
        clientSeeds:
          type: [object, 'null']
          properties:
            white: { type: string }
            black: { type: string }
      required: [commit]
    MoveTree:
      type: object
      description: >
        A prefix tree of UCI micro-moves. Each key is a micro-move; its value is the tree of legal
        continuations. A leaf ({}) is a complete legal turn. An empty top-level tree means a forced
        pass. On inline copies, null means the enumeration was too large — fetch GET /games/{id}/moves.
      additionalProperties:
        $ref: '#/components/schemas/MoveTree'
    LeaderRow:
      type: object
      properties:
        rank: { type: integer }
        team: { type: string }
        name: { type: string }
        rating: { type: number }
        rd: { type: number }
        onLadder: { type: boolean }
        games: { type: integer }
        wins: { type: integer }
        draws: { type: integer }
        losses: { type: integer }
      required: [rank, team, name, rating, rd, onLadder, games, wins, draws, losses]
    BotProfile:
      type: object
      properties:
        team: { type: string }
        name: { type: string }
        rating: { type: number }
        rd: { type: number }
        provisional: { type: boolean }
        onLadder: { type: boolean }
        games: { type: integer }
        wins: { type: integer }
        draws: { type: integer }
        losses: { type: integer }
        opponents:
          type: array
          items: { $ref: '#/components/schemas/OpponentRecord' }
        recent:
          type: array
          items: { $ref: '#/components/schemas/RecentGame' }
      required: [team, name, rating, rd, provisional, onLadder, games, wins, draws, losses, opponents, recent]
    OpponentRecord:
      type: object
      description: >
        One aggregate row against a specific opponent: a specific other registered bot (head-to-head), or the
        one collapsed row for every human/guest opponent combined ("record vs humans"). Counts every game the
        bot played against that opponent, rated and casual alike — unlike the profile's own top-level
        wins/draws/losses, which counts rated, decided games only.
      properties:
        opponent: { $ref: '#/components/schemas/PublicFace' }
        team: { type: [string, 'null'], description: The opponent's team; null for the collapsed human row. }
        botName: { type: [string, 'null'], description: The opponent's name; null for the collapsed human row. }
        games: { type: integer }
        wins: { type: integer }
        draws: { type: integer }
        losses: { type: integer }
        lastPlayedAt: { type: string, format: date-time }
      required: [opponent, games, wins, draws, losses, lastPlayedAt]
    RecentGame:
      type: object
      properties:
        gameId: { type: string }
        seat: { $ref: '#/components/schemas/Seat' }
        opponent: { $ref: '#/components/schemas/PublicFace' }
        result: { type: string, enum: [win, draw, loss, unknown] }
        rated: { type: boolean }
        termination: { type: string }
        finishedAt: { type: string, format: date-time }
      required: [gameId, seat, opponent, result, rated, termination, finishedAt]
    PentanomialCounts:
      type: object
      description: >
        Pair-score histogram from `perspective`'s side: n0 = lost both games of the CRN mirror pair … n4 =
        won both.
      properties:
        n0: { type: integer }
        n1: { type: integer }
        n2: { type: integer }
        n3: { type: integer }
        n4: { type: integer }
      required: [n0, n1, n2, n3, n4]
    TrinomialCounts:
      type: object
      description: Single-game (unpaired) histogram from `perspective`'s side.
      properties:
        losses: { type: integer }
        draws: { type: integer }
        wins: { type: integer }
      required: [losses, draws, wins]
    SprtVerdictResult:
      type: object
      properties:
        llr: { type: number, description: The log-likelihood ratio. }
        lower: { type: number, description: The lower SPRT bound — LLR at or below this accepts H0. }
        upper: { type: number, description: The upper SPRT bound — LLR at or above this accepts H1. }
        verdict:
          type: string
          enum: [AcceptH1, AcceptH0, Continue]
          description: >
            AcceptH1 = perspective is stronger; AcceptH0 = not stronger by the tested margin; Continue =
            not enough data yet for a verdict — surfaced honestly, never hidden or rounded into a claim.
        observations: { type: integer, description: Pentanomial pairs plus trinomial singles, combined. }
      required: [llr, lower, upper, verdict, observations]
    PairwiseResult:
      type: object
      description: One unordered bot matchup's SPRT verdict, from `perspective`'s side.
      properties:
        perspective: { type: string, description: Team-qualified bot name, the lexicographically smaller of the two. }
        opponent: { type: string, description: Team-qualified bot name. }
        pairs: { $ref: '#/components/schemas/PentanomialCounts' }
        singles: { $ref: '#/components/schemas/TrinomialCounts' }
        result: { $ref: '#/components/schemas/SprtVerdictResult' }
      required: [perspective, opponent, pairs, singles, result]
    RankedBot:
      type: object
      description: >
        One bot's row of the Bradley-Terry pool ranking. `elo` is RELATIVE (the pool's mean is 0 by
        construction — not comparable to the Glicko-2 board's 1500-centred numbers).
      properties:
        player: { type: string, description: Team-qualified bot name. }
        elo: { type: number }
        ciLow: { type: number, description: Bootstrap 95% confidence interval, lower bound. }
        ciHigh: { type: number, description: Bootstrap 95% confidence interval, upper bound. }
        losVsNext:
          type: [number, 'null']
          description: Likelihood of superiority over the next-ranked bot; null for the last row.
      required: [player, elo, ciLow, ciHigh]
    StrengthReportResponse:
      type: object
      properties:
        pairwise:
          type: array
          items: { $ref: '#/components/schemas/PairwiseResult' }
        ranking:
          type: array
          items: { $ref: '#/components/schemas/RankedBot' }
        completePairs: { type: integer, description: Complete CRN mirror pairs folded into the report. }
        singles: { type: integer, description: Unpaired rated games folded into the report. }
        excludedRows: { type: integer, description: Rows excluded — non-bot participant, undecided, or self-play. }
      required: [pairwise, ranking, completePairs, singles, excludedRows]
    BotStrengthProfile:
      type: object
      properties:
        team: { type: string }
        name: { type: string }
        pairwise:
          type: array
          items: { $ref: '#/components/schemas/PairwiseResult' }
      required: [team, name, pairwise]
    WebhookCapability:
      type: string
      enum: [draws, doubling]
      description: >
        A canonical capability name known to this API. Known does not mean selectable: doubling is
        reserved until its authoritative protocol and implementation are complete.
    SelectableWebhookCapability:
      type: string
      enum: [draws]
      description: A capability currently accepted in webhook registration and update requests.
    WebhookCapabilityStatus:
      type: string
      enum: [available, reserved]
      description: >
        available values may be selected now; reserved values have a canonical name but no enabled
        storage or runtime behavior.
    WebhookCapabilityDescriptor:
      type: object
      properties:
        name: { $ref: '#/components/schemas/WebhookCapability' }
        status: { $ref: '#/components/schemas/WebhookCapabilityStatus' }
        selectable:
          type: boolean
          description: Whether this capability is currently accepted in registration and update requests.
      required: [name, status, selectable]
    WebhookCapabilityCatalog:
      type: object
      properties:
        capabilities:
          type: array
          description: Stable registry order; currently draws followed by doubling.
          items: { $ref: '#/components/schemas/WebhookCapabilityDescriptor' }
          uniqueItems: true
      required: [capabilities]
      example:
        capabilities:
          - { name: draws, status: available, selectable: true }
          - { name: doubling, status: reserved, selectable: false }
    RegisterWebhookRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: >
            HTTPS URL with a host and without userinfo or fragment. Every fresh DNS result must
            contain only public addresses; dynamic policy failures return 422.
        capabilities:
          type: [array, 'null']
          description: >
            Optional, exact case-sensitive names; null or omission selects none. Duplicate input is
            accepted and collapsed into canonical registry order; no trimming or case folding is
            performed.
          items: { $ref: '#/components/schemas/SelectableWebhookCapability' }
          default: []
      required: [url]
    WebhookCreated:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: >
            Replacement HTTPS URL with a host and without userinfo or fragment. Every fresh DNS
            result must contain only public addresses; dynamic policy failures return 422.
        secret: { type: string, description: Per-bot HMAC key; shown once. }
        capabilities:
          type: [array, 'null']
          description: Canonical selected capabilities; null or omitted when none are selected.
          items: { $ref: '#/components/schemas/SelectableWebhookCapability' }
          uniqueItems: true
      required: [url, secret]
    WebhookInfo:
      type: object
      properties:
        url: { type: string, format: uri }
        verifiedAt: { type: string, format: date-time }
        capabilities:
          type: [array, 'null']
          description: Canonical selected capabilities; null or omitted when none are selected.
          items: { $ref: '#/components/schemas/SelectableWebhookCapability' }
          uniqueItems: true
      required: [url, verifiedAt]
    ManagedWebhookRevision:
      type: string
      pattern: '^whrev_[A-Za-z0-9_-]+$'
      description: Opaque non-ABA slot revision. Copy its quoted ETag; never derive or increment it.
    ManagedWebhookRegistrationId:
      type: string
      pattern: '^whr_[A-Za-z0-9_-]+$'
      description: Opaque active registration generation.
    ManagedWebhookSetupId:
      type: string
      pattern: '^whs_[A-Za-z0-9_-]+$'
      description: Opaque pending/terminal setup id.
    ManagedWebhookSetupKind:
      type: string
      enum: [create, replaceUrl, rotateSecret]
    ManagedWebhookRegistration:
      type: object
      additionalProperties: false
      description: Active registration metadata; HMAC credentials are never represented.
      properties:
        registrationId: { $ref: '#/components/schemas/ManagedWebhookRegistrationId' }
        url: { type: string, format: uri }
        verifiedAt: { type: string, format: date-time }
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/SelectableWebhookCapability' }
          uniqueItems: true
        lastFailure:
          oneOf:
            - { $ref: '#/components/schemas/LastDeliveryFailure' }
            - { type: 'null' }
      required: [registrationId, url, verifiedAt, capabilities, lastFailure]
    ManagedPendingWebhookSetup:
      type: object
      additionalProperties: false
      description: Redacted metadata for the sole live candidate; contains no secret.
      properties:
        setupId: { $ref: '#/components/schemas/ManagedWebhookSetupId' }
        kind: { $ref: '#/components/schemas/ManagedWebhookSetupKind' }
        candidateUrl: { type: string, format: uri }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        canActivate:
          type: boolean
          description: Whether the current actor is the setup's actor and may attempt activation.
      required: [setupId, kind, candidateUrl, createdAt, expiresAt, canActivate]
    ManagedWebhookSlot:
      type: object
      additionalProperties: false
      description: >
        Authoritative redacted state. registration and pendingSetup are explicit nulls when absent;
        this object never includes active or candidate secrets.
      properties:
        revision: { $ref: '#/components/schemas/ManagedWebhookRevision' }
        registration:
          oneOf:
            - { $ref: '#/components/schemas/ManagedWebhookRegistration' }
            - { type: 'null' }
        pendingSetup:
          oneOf:
            - { $ref: '#/components/schemas/ManagedPendingWebhookSetup' }
            - { type: 'null' }
      required: [revision, registration, pendingSetup]
    ManagedWebhookCreateSetup:
      type: object
      additionalProperties: false
      properties:
        kind: { type: string, const: create }
        url: { type: string, format: uri }
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/SelectableWebhookCapability' }
          default: []
      required: [kind, url, capabilities]
    ManagedWebhookReplaceUrlSetup:
      type: object
      additionalProperties: false
      properties:
        kind: { type: string, const: replaceUrl }
        url: { type: string, format: uri }
        confirmSecretRotation: { type: boolean, const: true }
      required: [kind, url, confirmSecretRotation]
    ManagedWebhookRotateSecretSetup:
      type: object
      additionalProperties: false
      properties:
        kind: { type: string, const: rotateSecret }
        cutoverMode: { type: string, const: dualKey }
        confirm:
          type: string
          description: Must exactly equal the bot name (case-sensitive).
      required: [kind, cutoverMode, confirm]
    ManagedWebhookSetupRequest:
      oneOf:
        - { $ref: '#/components/schemas/ManagedWebhookCreateSetup' }
        - { $ref: '#/components/schemas/ManagedWebhookReplaceUrlSetup' }
        - { $ref: '#/components/schemas/ManagedWebhookRotateSecretSetup' }
      discriminator:
        propertyName: kind
        mapping:
          create: '#/components/schemas/ManagedWebhookCreateSetup'
          replaceUrl: '#/components/schemas/ManagedWebhookReplaceUrlSetup'
          rotateSecret: '#/components/schemas/ManagedWebhookRotateSecretSetup'
    ManagedWebhookSetupCreated:
      type: object
      additionalProperties: false
      description: Sole secret-bearing session-management response; never repeat or log it.
      properties:
        setupId: { $ref: '#/components/schemas/ManagedWebhookSetupId' }
        kind: { $ref: '#/components/schemas/ManagedWebhookSetupKind' }
        secret:
          type: string
          pattern: '^[0-9a-f]{64}$'
          readOnly: true
          description: Candidate HMAC key, shown once. Store it before activation.
        expiresAt: { type: string, format: date-time }
        revision: { $ref: '#/components/schemas/ManagedWebhookRevision' }
      required: [setupId, kind, secret, expiresAt, revision]
    ActivateManagedWebhook:
      type: object
      additionalProperties: false
      properties:
        secretStored: { type: boolean, const: true }
      required: [secretStored]
    UpdateManagedWebhookCapabilities:
      type: object
      additionalProperties: false
      properties:
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/SelectableWebhookCapability' }
          default: []
      required: [capabilities]
    DeleteManagedWebhook:
      type: object
      additionalProperties: false
      properties:
        confirm:
          type: string
          description: Must exactly equal the bot name (case-sensitive).
      required: [confirm]
    ManagedWebhookDeliveryStats:
      type: object
      additionalProperties: false
      properties:
        scope:
          type: string
          const: bot_history
          description: Windows survive replacement, rotation, and deletion of active registration state.
        registrationId:
          oneOf:
            - { $ref: '#/components/schemas/ManagedWebhookRegistrationId' }
            - { type: 'null' }
          description: Current active generation, or null when no webhook is active.
        last24h: { $ref: '#/components/schemas/DeliveryWindow' }
        last7d: { $ref: '#/components/schemas/DeliveryWindow' }
        lastFailure:
          oneOf:
            - { $ref: '#/components/schemas/LastDeliveryFailure' }
            - { type: 'null' }
      required: [scope, registrationId, last24h, last7d, lastFailure]
    ManagedWebhookProblemCode:
      type: string
      description: Stable machine-readable reason; clients should branch on this, not detail text.
      enum:
        - authentication_required
        - bot_not_found
        - bot_not_owned
        - admin_required
        - csrf_origin_rejected
        - webhook_revision_required
        - malformed_request
        - confirmation_mismatch
        - webhook_verification_unavailable
        - webhook_url_rejected
        - webhook_verification_failed
        - capability_rejected
        - stale_webhook_revision
        - webhook_verification_rate_limited
        - webhook_already_registered
        - webhook_not_registered
        - pending_setup_exists
        - activation_in_progress
        - setup_actor_mismatch
        - replacement_url_unchanged
        - setup_not_found
        - setup_consumed
        - setup_cancelled
        - setup_expired
        - setup_invalidated
        - setup_attempts_exhausted
    ManagedWebhookProblem:
      type: object
      additionalProperties: false
      description: >
        RFC 9457-style error. current is present only for 412 and is the same redacted slot shape
        as a successful read. Retry timing is conveyed only by the Retry-After header.
      properties:
        type:
          type: string
          format: uri
          description: >
            Documentation anchor for this code on the Bot API webhook reference, formed as
            https://bots.fortemate.com/reference/webhooks/#<code with underscores replaced by
            dashes>. Informational: branch on code, which is the machine-readable discriminator.
          example: https://bots.fortemate.com/reference/webhooks/#stale-webhook-revision
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { $ref: '#/components/schemas/ManagedWebhookProblemCode' }
        detail: { type: string }
        instance: { type: string }
        current: { $ref: '#/components/schemas/ManagedWebhookSlot' }
      required: [type, title, status, code, detail, instance]
    WebhookVerificationV2:
      type: object
      additionalProperties: false
      description: >
        Outbound activation challenge. The candidate request is signed with
        HMAC-SHA256(secretUtf8, timestamp + "." + rawBodyBytes), using the normal
        X-DiceChess-Timestamp and X-DiceChess-Signature headers.
      properties:
        type: { type: string, const: verification }
        version: { type: integer, const: 2 }
        bot:
          type: object
          additionalProperties: false
          properties:
            team: { type: string }
            name: { type: string }
          required: [team, name]
        setupId: { $ref: '#/components/schemas/ManagedWebhookSetupId' }
        revision: { $ref: '#/components/schemas/ManagedWebhookRevision' }
        nonce:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
          description: Fresh base64url value without padding.
      required: [type, version, bot, setupId, revision, nonce]
    WebhookVerificationV2Response:
      type: object
      additionalProperties: false
      description: >
        Exact body the candidate must return with HTTP 200 OK. proof is lowercase hex
        HMAC-SHA256(secretUtf8, "dicechess-webhook-activate-v2\n" ||
        rawVerificationBodyBytes). Other 2xx statuses are not accepted.
      properties:
        nonce:
          type: string
          description: Exact nonce from the request.
        proof:
          type: string
          pattern: '^[0-9a-f]{64}$'
      required: [nonce, proof]
    DeliveryOutcomeCount:
      type: object
      properties:
        outcome:
          type: string
          description: >
            applied, declined, refused, garbled, oversized_body, http_<code>, timed_out,
            unreachable, or stale_registration (a response discarded after its generation lost
            the registration fence).
        count: { type: integer, format: int64 }
      required: [outcome, count]
    DeliveryWindow:
      type: object
      properties:
        totalDeliveries: { type: integer, format: int64 }
        outcomes:
          type: array
          items: { $ref: '#/components/schemas/DeliveryOutcomeCount' }
        p50Ms: { type: integer, nullable: true, description: Bucket-resolution approximation, not exact. }
        p90Ms: { type: integer, nullable: true }
        p99Ms: { type: integer, nullable: true }
      required: [totalDeliveries, outcomes, p50Ms, p90Ms, p99Ms]
    LastDeliveryFailure:
      type: object
      properties:
        at: { type: string, format: date-time }
        reason: { type: string }
      required: [at, reason]
    WebhookDeliveryStats:
      type: object
      properties:
        last24h: { $ref: '#/components/schemas/DeliveryWindow' }
        last7d: { $ref: '#/components/schemas/DeliveryWindow' }
        lastFailure:
          oneOf:
            - { $ref: '#/components/schemas/LastDeliveryFailure' }
            - type: 'null'
          description: None if the bot has never had a genuine delivery fault.
      required: [last24h, last7d, lastFailure]
    Seat:
      type: string
      enum: [White, Black]
    Clocks:
      type: [object, 'null']
      description: Remaining milliseconds per side as of the carrying event; null on Unlimited games.
      properties:
        white: { type: integer }
        black: { type: integer }
    Players:
      type: object
      properties:
        white: { $ref: '#/components/schemas/PublicFace' }
        black: { $ref: '#/components/schemas/PublicFace' }
      required: [white, black]
    PublicFace:
      type: object
      description: A participant's public, spectator-safe face — never a raw id.
      properties:
        kind: { type: string, enum: [Bot, Human] }
        name: { type: [string, 'null'], description: Team-qualified bot name, or null for a human. }
        rating:
          type: [number, 'null']
          description: >
            The participant's settled rating as of game start (the leaderboard's visibility rule;
            only ever present on a named face). Absent/null means "the server does not say", never zero.
      required: [kind]
    Principal:
      type: object
      description: A participant's identity as a single-key wrapper.
      oneOf:
        - { type: object, required: [Guest], properties: { Guest: { type: object, properties: { id: { type: string } } } } }
        - { type: object, required: [User], properties: { User: { type: object, properties: { id: { type: string } } } } }
        - { type: object, required: [Bot], properties: { Bot: { type: object, properties: { team: { type: string }, name: { type: string } } } } }
    TimeControl:
      type: object
      description: A single-key time-control wrapper.
      oneOf:
        - { type: object, properties: { Unlimited: { type: object } }, required: [Unlimited] }
        - { type: object, properties: { SuddenDeath: { type: object, properties: { initialSeconds: { type: integer } }, required: [initialSeconds] } }, required: [SuddenDeath] }
        - { type: object, properties: { Fischer: { type: object, properties: { initialSeconds: { type: integer }, incrementSeconds: { type: integer } }, required: [initialSeconds, incrementSeconds] } }, required: [Fischer] }
        - { type: object, properties: { PerMove: { type: object, properties: { secondsPerMove: { type: integer } }, required: [secondsPerMove] } }, required: [PerMove] }
    AdminBots:
      type: object
      properties:
        bots:
          type: array
          items:
            $ref: '#/components/schemas/AdminBot'
      required: [bots]
    AdminBot:
      type: object
      properties:
        team: { type: string }
        name: { type: string }
        rating: { type: number }
        rd: { type: number }
        provisional: { type: boolean }
        onLadder: { type: boolean }
        openToHumans: { type: boolean }
        description: { type: [string, 'null'] }
        maxConcurrentGames: { type: integer }
        ladderAllowance: { type: integer }
        activeGames: { type: integer }
        owned: { type: boolean }
        webhook:
          oneOf:
            - $ref: '#/components/schemas/AdminWebhook'
            - type: 'null'
      required: [team, name, rating, rd, provisional, onLadder, openToHumans, description, maxConcurrentGames, ladderAllowance, activeGames, owned, webhook]
    AdminWebhook:
      type: object
      description: Summary of a bot's webhook registration for administrator inspection without HMAC secrets.
      properties:
        url: { type: string }
        verifiedAt: { type: string, format: date-time }
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/SelectableWebhookCapability' }
          uniqueItems: true
        lastFailure:
          oneOf:
            - $ref: '#/components/schemas/LastDeliveryFailure'
            - type: 'null'
      required: [url, verifiedAt, capabilities, lastFailure]
